name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build generatePomFileForMavenPublication
      # README promises Kotlin 2.0 consumers; a newer stdlib in the POM breaks their compilation.
      - run: grep -A1 '<artifactId>kotlin-stdlib</artifactId>' build/publications/maven/pom-default.xml | grep -q '<version>2.0.0</version>'
